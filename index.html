<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://94.185.76.20:8000 https://94.185.76.20:8000; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self';">
  <title>Domotica Casa Lazise</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="main-container">
    <div class="title-container">
      <h2>Domotica Casa Lazise</h2>
    </div>
    <div class="buttons-container" role="group" aria-label="Controlli domotica">
      <button id="apri-cancelletto" class="link-button" type="button" aria-label="Apri il cancelletto di ingresso">
        Apri Cancelletto
      </button>
      <button id="cancello-grande" class="link-button" type="button" aria-label="Apri il cancello grande">
        Cancello Grande
      </button>
      <button id="basculante" class="link-button" type="button" aria-label="Apri il basculante del garage">
        Basculante
      </button>
      <button id="luci-garage" class="link-button" type="button" aria-label="Accendi o spegni le luci del garage">
        Luci Garage
      </button>
      <button id="login-button" class="link-button login-button" type="button" aria-label="Accedi al pannello di amministrazione">
        Login
      </button>
    </div>
  </div>
  <div class="disclaimer">
    Alla prima apertura effettua il login con le tue credenziali
  </div>

  <!-- Modale di Login -->
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <span id="close-login-modal" class="close-modal">&times;</span>
      <h3>Accedi</h3>
      <form id="auth-login-form">
        <div class="form-group">
          <label for="auth-username">Username</label>
          <input type="text" id="auth-username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="link-button">Accedi</button>
      </form>
      <p class="modal-note">Nota: L'autenticazione è attualmente disabilitata. Puoi abilitarla modificando <code>enableAuth: true</code> in app.js</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
